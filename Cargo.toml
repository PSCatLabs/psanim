[workspace]
resolver = "3"
members = ["crates/psanim", "crates/psanim-cli", "crates/psanim-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# PSCat's 0.8.0 development branch; Cargo.lock pins the revision
# (see docs/pscat-integration.md for how to move it or build against a
# local checkout).
pscat = { git = "https://github.com/PSCatLabs/pscat", branch = "feature/0.8.0", default-features = false }

[profile.release]
opt-level = 3
debug = 1

# The browser build: no debug info, link-time optimization, one codegen
# unit. `scripts/build_wasm.sh` uses it.
[profile.wasm]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"
