[workspace]
resolver = "3"
members = ["crates/psanim", "crates/psanim-cli", "crates/psanim-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Local development dependency on the PSCat feature branch
# `feature/psanim-library-api` (see docs/pscat-integration.md).
pscat = { path = "../pscat-psanim-api", default-features = false }

[profile.release]
opt-level = 3
debug = 1

# The browser build: no debug info, link-time optimization, one codegen
# unit. `scripts/build_wasm.sh` uses it.
[profile.wasm]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"
